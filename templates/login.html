{% extends "base.html" %}

{% block title %}Sign In — CareerBot{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="navbar-brand-icon mx-auto mb-3" style="width: 52px; height: 52px;">
                        <i data-lucide="bot" style="width: 28px; height: 28px;"></i>
                    </div>
                    <h3 class="fw-bold text-main">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your CareerBot account to access your AI assistant, job recommendations, and roadmaps.</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label for="login_id" class="form-label fw-semibold small text-muted">Email Address or Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-subtle border-end-0 text-muted"><i data-lucide="user" style="width: 16px; height: 16px;"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="login_id" name="login_id" placeholder="student@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-subtle border-end-0 text-muted"><i data-lucide="lock" style="width: 16px; height: 16px;"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                            <button class="btn btn-outline-custom border-start-0 text-muted" type="button" onclick="togglePasswordVisibility('password', 'toggleIcon')">
                                <i data-lucide="eye" id="toggleIcon" style="width: 16px; height: 16px;"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label small text-muted" for="remember">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3 d-inline-flex align-items-center justify-content-center gap-2">
                        Sign In <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-color">
                    <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="fw-semibold text-primary text-decoration-none">Create Account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
