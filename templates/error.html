{% extends "base.html" %}

{% block title %}{{ title }} — CareerBot{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-5">
                <h1 class="display-1 fw-bold text-primary mb-2">{{ code }}</h1>
                <h4 class="fw-bold text-main mb-3">{{ title }}</h4>
                <p class="text-muted small mb-4">{{ message }}</p>
                <div class="d-flex justify-content-center gap-2">
                    {% if g.current_user %}
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary-custom px-4 d-inline-flex align-items-center gap-2">
                        <i data-lucide="layout-dashboard" style="width: 16px; height: 16px;"></i> Dashboard
                    </a>
                    {% else %}
                    <a href="{{ url_for('index') }}" class="btn btn-primary-custom px-4 d-inline-flex align-items-center gap-2">
                        <i data-lucide="home" style="width: 16px; height: 16px;"></i> Home
                    </a>
                    <a href="{{ url_for('login') }}" class="btn btn-outline-custom px-4">
                        Sign In
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
